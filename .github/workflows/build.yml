name: Build VisageVault Releases

permissions:
  contents: write

on:
  push:
    tags:
      - "*"

jobs:

  ##########################################
  # 1) WINDOWS (EXE)
  ##########################################
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versión: sale del tag y se usa para la app (visagevault_version.py) y para los paquetes.
      # dpkg y rpm exigen que empiece por un dígito
      # (tag "v1.2.0" -> "1.2.0"; lanzado a mano sin tag -> "0.0.0+git<commit>")
      - name: Package Version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # La app lee su versión de aquí (no está en git; en local vale "dev")
          echo "__version__ = \"$VERSION\"" > visagevault_version.py
          echo "Versión del paquete: $VERSION"

      # --- INYECCIÓN DE SECRETOS (Windows) ---
      - name: Inject Google Credentials
        run: |
          sed -i "s/BUILD_TIME_CLIENT_ID/${{ secrets.GOOGLE_CLIENT_ID }}/g" drive_auth.py
          sed -i "s/BUILD_TIME_CLIENT_SECRET/${{ secrets.GOOGLE_CLIENT_SECRET }}/g" drive_auth.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm \
            --onefile \
            --windowed \
            --name "VisageVault" \
            --add-data "visagevault.png;." \
            --add-data "AnabasaSoft.png;." \
            --collect-data face_recognition_models \
            --collect-all rawpy \
            --hidden-import piexif \
            --hidden-import numpy \
            --hidden-import sklearn \
            --hidden-import scipy._cyutility \
            --hidden-import sklearn._cyutility \
            --hidden-import google_auth_oauthlib \
            --hidden-import googleapiclient \
            visagevault.py

      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/VisageVault.exe
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false

  ##########################################
  # 2) MACOS (DMG)
  ##########################################
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versión: sale del tag y se usa para la app (visagevault_version.py) y para los paquetes.
      # dpkg y rpm exigen que empiece por un dígito
      # (tag "v1.2.0" -> "1.2.0"; lanzado a mano sin tag -> "0.0.0+git<commit>")
      - name: Package Version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # La app lee su versión de aquí (no está en git; en local vale "dev")
          echo "__version__ = \"$VERSION\"" > visagevault_version.py
          echo "Versión del paquete: $VERSION"

      # --- INYECCIÓN DE SECRETOS (macOS) ---
      - name: Inject Google Credentials
        run: |
          sed -i '' "s/BUILD_TIME_CLIENT_ID/${{ secrets.GOOGLE_CLIENT_ID }}/g" drive_auth.py
          sed -i '' "s/BUILD_TIME_CLIENT_SECRET/${{ secrets.GOOGLE_CLIENT_SECRET }}/g" drive_auth.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          brew install create-dmg

      - name: Build macOS App
        run: |
          pyinstaller --noconfirm \
            --onedir \
            --windowed \
            --name "VisageVault" \
            --add-data "visagevault.png:." \
            --add-data "AnabasaSoft.png:." \
            --collect-data face_recognition_models \
            --collect-all rawpy \
            --hidden-import piexif \
            --hidden-import numpy \
            --hidden-import sklearn \
            --hidden-import scipy._cyutility \
            --hidden-import sklearn._cyutility \
            --hidden-import google_auth_oauthlib \
            --hidden-import googleapiclient \
            visagevault.py

      - name: Create DMG
        run: |
          create-dmg \
            --volname "VisageVault Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "VisageVault.app" 200 190 \
            --hide-extension "VisageVault.app" \
            --app-drop-link 600 185 \
            "VisageVault-macOS.dmg" \
            "dist/VisageVault.app"

      - name: Upload macOS Asset
        uses: softprops/action-gh-release@v1
        with:
          files: VisageVault-macOS.dmg
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false

  ##########################################
  # 3) LINUX BINARY (AppImage / DEB / RPM)
  ##########################################
  build-linux-bin:
    # 22.04 como CloudMount Wizard: dpkg-sig ya no existe en Ubuntu 24.04 (ubuntu-latest).
    # Además, una glibc más antigua hace el binario compatible con más distribuciones.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Versión: sale del tag y se usa para la app (visagevault_version.py) y para los paquetes.
      # dpkg y rpm exigen que empiece por un dígito
      # (tag "v1.2.0" -> "1.2.0"; lanzado a mano sin tag -> "0.0.0+git<commit>")
      - name: Package Version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # La app lee su versión de aquí (no está en git; en local vale "dev")
          echo "__version__ = \"$VERSION\"" > visagevault_version.py
          echo "Versión del paquete: $VERSION"

      # --- INYECCIÓN DE SECRETOS (Linux Binary) ---
      - name: Inject Google Credentials
        run: |
          sed -i "s/BUILD_TIME_CLIENT_ID/${{ secrets.GOOGLE_CLIENT_ID }}/g" drive_auth.py
          sed -i "s/BUILD_TIME_CLIENT_SECRET/${{ secrets.GOOGLE_CLIENT_SECRET }}/g" drive_auth.py

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libopenblas-dev liblapack-dev \
            ffmpeg qt6-base-dev ruby-dev libarchive-tools rpm dpkg-sig gnupg
          sudo gem install fpm

      # La clave privada de AnabasaSoft vive solo en los secrets del repo, nunca en el código
      # (misma clave y mismos pasos que CloudMount Wizard)
      - name: Importar clave GPG de firma
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY_BASE64: ${{ secrets.GPG_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$GPG_KEY_ID" ] || [ -z "$GPG_PRIVATE_KEY_BASE64" ]; then
            echo "::error::Faltan los secrets GPG_KEY_ID y/o GPG_PRIVATE_KEY_BASE64 en Settings → Secrets and variables → Actions"
            exit 1
          fi
          echo "$GPG_PRIVATE_KEY_BASE64" | base64 -d | gpg --batch --import
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name $GPG_KEY_ID
          %__gpg_sign_cmd %{__gpg} gpg --force-v3-sigs --digest-algo sha256 --batch --no-armor --pinentry-mode loopback --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} --digest-algo sha256 %{__plaintext_filename}
          EOF

      - name: Download linuxdeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux Binary
        run: |
          pyinstaller --noconfirm \
            --onedir \
            --windowed \
            --name "VisageVault" \
            --add-data "visagevault.png:." \
            --add-data "AnabasaSoft.png:." \
            --collect-data face_recognition_models \
            --collect-all rawpy \
            --hidden-import piexif \
            --hidden-import numpy \
            --hidden-import sklearn \
            --hidden-import scipy._cyutility \
            --hidden-import sklearn._cyutility \
            --hidden-import google_auth_oauthlib \
            --hidden-import googleapiclient \
            visagevault.py

      - name: Prepare AppDir
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/VisageVault/* AppDir/usr/bin/
          chmod +x AppDir/usr/bin/VisageVault
          cp visagevault.png AppDir/usr/share/icons/hicolor/256x256/apps/visagevault.png

          cat << EOF > AppDir/usr/share/applications/visagevault.desktop
          [Desktop Entry]
          Name=VisageVault
          Comment=Gestor Inteligente de Fotos y Videos
          Exec=VisageVault
          Icon=visagevault
          Type=Application
          Categories=Graphics;Photography;
          Terminal=false
          EOF

      - name: Generate AppImage
        run: |
          export LINUXDEPLOY_OUTPUT_VERSION="${{ github.ref_name }}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/visagevault.desktop \
            --executable AppDir/usr/bin/VisageVault \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/visagevault.png \
            --output appimage

      # Estructura: build en /opt/visagevault, enlace en /usr/bin, .desktop e icono en /usr/share
      - name: Build DEB / RPM
        run: |
          # $VERSION viene del paso "Package Version"
          STAGE=pkgroot
          mkdir -p $STAGE/opt/visagevault $STAGE/usr/bin \
                   $STAGE/usr/share/applications $STAGE/usr/share/icons/hicolor/256x256/apps
          chmod 755 $STAGE
          cp -a dist/VisageVault/. $STAGE/opt/visagevault/
          ln -s /opt/visagevault/VisageVault $STAGE/usr/bin/visagevault
          cp visagevault.png $STAGE/usr/share/icons/hicolor/256x256/apps/visagevault.png

          cat << EOF > $STAGE/usr/share/applications/visagevault.desktop
          [Desktop Entry]
          Name=VisageVault
          Comment=Gestor de fotografías inteligente
          Exec=visagevault
          Icon=visagevault
          Type=Application
          Categories=Graphics;Photography;
          Terminal=false
          EOF
          sed -i 's/^ *//' $STAGE/usr/share/applications/visagevault.desktop

          COMMON="-s dir -n visagevault -v $VERSION --iteration 1 \
            --description 'Gestor de fotografías inteligente con reconocimiento facial.' \
            --maintainer 'Daniel Serrano Armenta <anabasasoft@gmail.com>' \
            --vendor AnabasaSoft --url https://github.com/AnabasaSoft/VisageVault \
            --license LGPL-3.0-or-later -C $STAGE"

          eval fpm $COMMON -t deb --architecture amd64 --deb-priority optional --deb-suggests ffmpeg \
            -p visagevault_${VERSION}_amd64.deb .

          # _build_id_links none: sin enlaces /usr/lib/.build-id. Otras apps empaquetadas
          # igual (PyInstaller + fpm) comparten bibliotecas idénticas y chocarían al instalarse.
          eval fpm $COMMON -t rpm --architecture x86_64 \
            --rpm-rpmbuild-define "'_build_id_links none'" \
            -p visagevault-${VERSION}-1.x86_64.rpm .

      # Firmar los paquetes con la clave de AnabasaSoft y comprobar las firmas
      - name: Firmar paquetes DEB y RPM
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          dpkg-sig --sign builder -k "$GPG_KEY_ID" *.deb
          rpm --addsign *.rpm
          dpkg-sig --verify *.deb
          # La clave pública vive en el repo (firma/), igual que en CloudMount Wizard
          rpm --import firma/anabasasoft_public.asc
          rpm --checksig *.rpm

      - name: Upload Linux Binaries
        uses: softprops/action-gh-release@v1
        with:
          files: |
            VisageVault*.AppImage
            *.deb
            *.rpm
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false

  ##########################################
  # 4) SOURCE TARBALL (Para AUR / Arch Linux)
  ##########################################
  build-source-aur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Versión: sale del tag y se usa para la app (visagevault_version.py) y para los paquetes.
      # dpkg y rpm exigen que empiece por un dígito
      # (tag "v1.2.0" -> "1.2.0"; lanzado a mano sin tag -> "0.0.0+git<commit>")
      - name: Package Version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0+git${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # La app lee su versión de aquí (no está en git; en local vale "dev")
          echo "__version__ = \"$VERSION\"" > visagevault_version.py
          echo "Versión del paquete: $VERSION"

      # --- INYECCIÓN DE SECRETOS (Source) ---
      - name: Inject Google Credentials
        run: |
          sed -i "s/BUILD_TIME_CLIENT_ID/${{ secrets.GOOGLE_CLIENT_ID }}/g" drive_auth.py
          sed -i "s/BUILD_TIME_CLIENT_SECRET/${{ secrets.GOOGLE_CLIENT_SECRET }}/g" drive_auth.py

      - name: Create Source Tarball
        run: |
          # 1. Obtener la versión pura (ej: 1.6.12) quitando la 'v' del tag
          VERSION_CLEAN="$VERSION"  # Del paso "Package Version" (visagevault_version.py va en *.py)

          # 2. Definir nombres
          DIR_NAME="visagevault-$VERSION_CLEAN"
          FILE_NAME="$DIR_NAME.tar.gz"

          echo "Generando paquete: $FILE_NAME"

          mkdir $DIR_NAME

          # 3. Copiar archivos
          cp *.py $DIR_NAME/
          cp visagevault.png $DIR_NAME/

          # 4. Comprimir
          tar -czvf $FILE_NAME $DIR_NAME

      - name: Upload Source Asset
        uses: softprops/action-gh-release@v1
        with:
          files: visagevault-*.tar.gz
          tag_name: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
